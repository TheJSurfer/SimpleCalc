
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=df243e11-8aa4-4e73-91ac-0c8a13855d93
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CELERO Digital Calculator</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <style>
    /* Global Font Force */
    * {
      font-family: 'Google Sans', sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: linear-gradient(to bottom right, #edf2f7, #e2e8f0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
    }
    .calculator {
      width: 320px;
      background: #fdfdfd;
      border: 2px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }
    .display {
      background: #000;
      color: #0f0;
      font-size: 2.2em;
      font-weight: 500;
      text-align: right;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      width: calc(100% - 24px);
      border: none;
      font-variant-numeric: tabular-nums;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
    }
    .keys button {
      padding: 18px;
      font-size: 1.25em;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .keys button:active,
    .keys button.keyboard-active {
      transform: scale(0.95);
    }
    .keys button:hover {
      background: #e8eaed;
    }
    .keys button.keyboard-active {
      background: #d2e3fc !important;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.4);
      transform: scale(0.97);
      transition: all 0.08s;
    }
    .keys .operator {
      background: #1a73e8;
      color: #fff;
    }
    .keys .operator:hover {
      background: #1765cc;
    }
    .keys .equal {
      background: #34a853;
      color: #fff;
      grid-column: span 2;
    }
    .keys .equal:hover {
      background: #2d9249;
    }
    .keys .clear {
      background: #ea4335;
      color: #fff;
    }
    footer {
      margin-top: 25px;
      font-size: 0.9em;
      color: #5f6368;
      text-align: center;
      line-height: 1.5;
    }
    /* BSOD Overlay */
    .bsod-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #010080;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 40px;
      text-align: left;
    }
    .bsod-overlay.red {
      background: #a50e0e;
    }
    .bsod-overlay h1 {
      font-size: 6em;
      margin: 0 0 20px 0;
      font-weight: 400;
    }
    .bsod-overlay p {
      font-size: 1.3em;
      margin: 10px 0;
      max-width: 500px;
      line-height: 1.4;
    }
    .bsod-overlay button#buyPackage {
      background: #fff;
      color: #010080;
      font-size: 1.1em;
      font-weight: 700;
      padding: 12px 30px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 30px;
    }
    /* Subscription Form */
    .subscription-form {
      display: none;
      flex-direction: column;
      width: 320px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
      color: #202124;
    }
    .subscription-form label {
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9em;
    }
    .subscription-form input {
      padding: 12px;
      font-size: 1em;
      margin-bottom: 20px;
      border: 1px solid #dadce0;
      border-radius: 6px;
    }
    .subscription-form button {
      padding: 12px;
      font-size: 1em;
      font-weight: 700;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="calculator" id="calculator">
    <input type="text" class="display" id="display" disabled value="0" />
    <div class="keys">
      <button class="clear" id="clear">C</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-value="-">−</button>
     
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="+">+</button>
     
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="equal" id="equal">=</button>
     
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="0">0</button>
     
      <button data-value="00">00</button>
      <button data-value="000">000</button>
      <button data-value=".">.</button>
    </div>
  </div>

  <div class="bsod-overlay" id="bsod" style="display: none;">
    <h1>:(</h1>
    <p>Your calculator ran into a problem and needs to restart.</p>
    <p>To continue using this device, please purchase a subscription package to unlock the system.</p>
   
    <button id="buyPackage">Buy Package</button>
   
    <div class="subscription-form" id="subscriptionForm">
      <label for="account">Bank Account / Credit Card No.:</label>
      <input type="text" id="account" name="account" placeholder="Enter number" />
     
      <label for="creditCard">Secondary Verification (Optional):</label>
      <input type="text" id="creditCard" name="creditCard" placeholder="Optional" />
     
      <button id="subscribeBtn">Subscribe Now</button>
    </div>
  </div>

  <footer>
    © Nahiyan Islam Joy - Powered by Vision, Innovation<br>
   All rights reserved.
  </footer>

  <script>
    (function() {
      const display = document.getElementById('display');
      const keys = document.querySelector('.keys');
      const bsod = document.getElementById('bsod');
      const buyPackageBtn = document.getElementById('buyPackage');
      const subscriptionForm = document.getElementById('subscriptionForm');
      const subscribeBtn = document.getElementById('subscribeBtn');
     
      let currentExpression = '';
      let errorAttempts = 0;
      let subscriptionCount = 0;
      let errorThreshold = 2;
      let permanentlyBlocked = false;
     
      function updateDisplay() {
        display.value = currentExpression || '0';
      }

      function lockCalculator() {
        bsod.style.display = 'flex';
        const buttons = keys.querySelectorAll('button');
        buttons.forEach(btn => btn.disabled = true);
      }
     
      function permanentlyLockCalculator() {
        permanentlyBlocked = true;
        bsod.classList.add('red');
        lockCalculator();
      }
     
      function resetCalculator() {
        currentExpression = '';
        errorAttempts = 0;
        updateDisplay();
        const buttons = keys.querySelectorAll('button');
        buttons.forEach(btn => btn.disabled = false);
      }
     
      // Mouse / Touch click handler
      keys.addEventListener('click', function(e) {
        if (bsod.style.display !== 'none' || permanentlyBlocked) return;
       
        const target = e.target.closest('button');
        if (!target) return;
   
        const value = target.getAttribute('data-value');
       
        if (target.id === 'clear') {
          currentExpression = '';
          updateDisplay();
          return;
        }
   
        if (target.id === 'equal') {
          try {
            let result = eval(currentExpression);
            if (isNaN(result) || !isFinite(result)) {
              throw new Error("Invalid");
            }
            currentExpression = result.toString();
          } catch (error) {
            errorAttempts++;
            if (errorAttempts >= errorThreshold) {
              lockCalculator();
              return;
            } else {
              currentExpression = 'Error';
            }
          }
          updateDisplay();
          return;
        }
   
        if (currentExpression === 'Error') currentExpression = '';
        currentExpression += value;
        updateDisplay();
      });
     
      // ─────────────── Keyboard Support ───────────────
      document.addEventListener('keydown', function(e) {
        // Prevent default browser behavior for operators, equals, etc.
        if (['+', '-', '*', '/', 'Enter', '=', 'Backspace', 'Delete', 'Escape', '.'].includes(e.key)) {
          e.preventDefault();
        }

        if (bsod.style.display !== 'none' || permanentlyBlocked) return;

        let key = e.key;
        let buttonToPress = null;

        // Numbers & decimal
        if (/^[0-9]$/.test(key)) {
          buttonToPress = document.querySelector(`button[data-value="${key}"]`);
        }
        else if (key === '.') {
          buttonToPress = document.querySelector('button[data-value="."]');
        }

        // Operators (also support x/X and : for multiply/divide)
        else if (key === '+') buttonToPress = document.querySelector('button[data-value="+"]');
        else if (key === '-') buttonToPress = document.querySelector('button[data-value="-"]');
        else if (key === '*' || key.toLowerCase() === 'x') buttonToPress = document.querySelector('button[data-value="*"]');
        else if (key === '/' || key === ':') buttonToPress = document.querySelector('button[data-value="/"]');

        // Equals / Calculate
        else if (key === 'Enter' || key === '=') {
          buttonToPress = document.getElementById('equal');
        }

        // Backspace → delete last character
        else if (key === 'Backspace') {
          if (currentExpression === 'Error') currentExpression = '';
          currentExpression = currentExpression.slice(0, -1);
          updateDisplay();
          return;
        }

        // Delete or Escape → full clear
        else if (key === 'Delete' || key === 'Escape') {
          currentExpression = '';
          updateDisplay();
          return;
        }

        // If we found a button to "press"
        if (buttonToPress) {
          // Visual feedback
          buttonToPress.classList.add('keyboard-active');
          setTimeout(() => buttonToPress.classList.remove('keyboard-active'), 140);

          // Trigger the same logic as clicking
          buttonToPress.click();
        }
      });

      buyPackageBtn.addEventListener('click', function() {
        subscriptionForm.style.display = 'flex';
        buyPackageBtn.style.display = 'none';
      });
     
      subscribeBtn.addEventListener('click', function() {
        const accountValue = document.getElementById('account').value.trim();
        const creditCardValue = document.getElementById('creditCard').value.trim();
        const forbiddenSerial = "12345678";
        if (accountValue.includes(forbiddenSerial) || creditCardValue.includes(forbiddenSerial)) {
          alert("Forbidden serial detected! System permanently locked.");
          permanentlyLockCalculator();
          return;
        }
       
        if (accountValue === "") {
          alert("Please enter valid billing information.");
          return;
        }
       
        subscriptionCount++;
        if (subscriptionCount === 1) {
          errorThreshold = 8;
          alert("Verification successful! Error limit increased to 8.");
        } else {
          errorThreshold = Infinity;
          alert("System fully activated. All restrictions removed.");
        }
       
        resetCalculator();
        subscriptionForm.style.display = 'none';
        bsod.style.display = 'none';
        buyPackageBtn.style.display = 'block';
        document.getElementById('account').value = "";
        document.getElementById('creditCard').value = "";
      });

      // Initial display
      updateDisplay();
    })();
  </script>
</body>
</html>
